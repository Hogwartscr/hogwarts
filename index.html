<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хогвартс ВГП</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        :root { --primary: #BEA7B9; --accent: #975F8F; --dark-accent: #48294E; --panel: #1F1B3D; --bg: #161228; --text: #EADCE6; }
        *{box-sizing:border-box}
        body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);min-height:100vh;padding:36px 20px;}
        .container{max-width:1100px;padding:32px 40px;background:linear-gradient(120deg, rgba(31,27,61,0.95), rgba(22,18,40,0.98));border: 1px solid var(--accent);border-radius:8px;margin: 0 auto; box-shadow: 0 24px 100px rgba(0,0,0,0.8);}
        h1,h2,h3{font-weight:normal;color:var(--primary);margin-top:0;}
        button{background:var(--primary);color:var(--bg);border-radius:4px;font-family:inherit;font-weight:bold;transition:all .2s;padding:12px;border:none;cursor:pointer;font-size: 14px;}
        button:hover{background:var(--accent); color:white;}
        input,select,textarea{font-family:inherit;background:rgba(0,0,0,0.2);color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:10px;font-size:14px;width:100%;margin-top:5px}
        select option{background:var(--panel)}
        label{color:var(--primary);font-weight:normal;display:block;margin-top:12px; font-size:14px;}
        
        .cabinet-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--dark-accent);padding-bottom:18px;gap:10px}
        .eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
        .text-button{width:auto;margin:0;padding:8px 0;background:transparent;color:var(--primary);font-size:14px}
        
        .character{display:grid;grid-template-columns:180px 1fr;gap:34px;margin:32px 0 16px;align-items:center}
        .portrait-wrap{height:230px;position:relative;border:1px solid var(--accent);padding:6px;background:var(--bg);box-shadow:0 0 15px rgba(151,95,143,0.3)}
        #portrait-empty{height:100%;display:grid;place-items:center;font-size:76px;color:var(--accent);background:radial-gradient(ellipse at 50% 40%,#48294E55,#161228)}
        
        .cabinet h1{font-size:42px;line-height:1.15;margin:0;color:var(--primary);}
        .character-details{display:flex;gap:26px;flex-wrap:wrap;margin:24px 0 10px}
        .character-details span{font-size:12px; color: var(--accent);}
        .character-details strong{display:block;font-size:15px;font-weight:normal;color:var(--text);margin-top:7px; word-break: break-all;}
        
        .resources{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;padding:22px 24px;background:rgba(72,41,78,0.3);border:1px solid var(--accent);border-left:4px solid var(--primary);margin:22px 0 38px;border-radius:4px;}
        .resources label{margin:0;display:flex;justify-content:space-between}
        .resources span{font-size:11px;letter-spacing:2px;color:var(--primary)}
        .resources strong{display:block;font-size:36px;color:var(--primary);margin-top:8px}
        
        .book-header { margin-top: 40px; border-top: 1px solid var(--dark-accent); padding-top: 20px; }
        .tabs{display:flex;gap:26px;border-bottom:1px solid var(--dark-accent);margin:24px 0; flex-wrap:wrap;}
        .tabs button{border-radius:0;width:auto;background:none;color:var(--accent);font-size:16px;padding:12px 0;margin:0;border-bottom:2px solid transparent}
        .tabs button[aria-pressed=true]{color:var(--primary);border-color:var(--primary)}
        
        /* Стили для карточек навыков */
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .skill-card { border: 1px solid var(--accent); background: rgba(31,27,61,0.6); padding: 20px; border-radius: 4px; display: flex; flex-direction: column; }
        .skill-card h3 { color: var(--primary); font-size: 22px; margin: 0 0 10px 0; display: flex; align-items: center; gap: 10px; }
        .skill-card p { font-size: 14px; color: var(--text); line-height: 1.5; margin-bottom: 20px; flex-grow: 1; white-space: pre-wrap;}
        .skill-card .status { font-size: 12px; color: var(--accent); margin-bottom: 10px; }
        .skill-card button { margin-top: 0; background: transparent; border: 1px solid var(--dark-accent); color: var(--accent); cursor: not-allowed; }
        
        .admin-panel { display: grid; gap: 15px; margin-top: 20px;}
        .admin-card { padding: 15px; border: 1px solid var(--accent); border-radius: 6px; background: rgba(72,41,78,0.2); }
        
        .builder-box { border: 1px dashed var(--primary); padding: 20px; margin-top: 20px; border-radius: 6px; background: rgba(0,0,0,0.2); }
        
        .role-switch { text-align: center; margin-top: 20px; border-top: 1px dashed var(--dark-accent); padding-top: 15px; }
        .role-switch a { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 14px;}
        .hidden { display: none !important; }
    </style>
</head>
<body>

<main class="container">
    <div id="loading" style="text-align:center; padding: 50px 0; color: var(--primary); font-size: 18px;">🔮 Загрузка...</div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <section id="main-menu" class="hidden" style="text-align:center;">
        <h1>Хогвартс ВГП</h1>
        <button type="button" onclick="openLogin()" style="margin-top: 30px; max-width: 400px;">🔑 Войти в профиль</button>
        <button type="button" onclick="openRegister()" style="margin-top: 15px; max-width: 400px; background: transparent; border: 1px solid var(--primary); color: var(--primary);">📝 Зарегистрироваться</button>
        <button type="button" onclick="openDirectorLogin()" style="margin-top: 15px; max-width: 400px; background: #99564b; color: white;">👑 Вход для Директора</button>
    </section>

    <!-- ЭКРАН ВХОДА -->
    <section id="login-screen" class="hidden">
        <h1>Вход в профиль</h1>
        <label>Ваш пароль:</label>
        <input type="password" id="login-pass" placeholder="Пароль">
        <button type="button" onclick="loginUser()" style="margin-top:20px;">Войти</button>
        <p id="login-error" style="color: #ff5555; font-size: 13px; margin-top: 10px; display: none;">Неверный пароль!</p>
        <div class="role-switch"><a onclick="toggleScreen('main')">← Назад</a></div>
    </section>

    <!-- ЭКРАН РЕГИСТРАЦИИ -->
    <section id="register-screen" class="hidden">
        <h1>Регистрация</h1>
        <label>Ваша роль:</label>
        <select id="reg-role">
            <option value="student">Студент</option>
            <option value="professor">Профессор</option>
        </select>
        <label>Имя персонажа:</label>
        <input type="text" id="reg-name" placeholder="Имя Фамилия">
        <label>Ссылка на вашу страницу ВК:</label>
        <input type="text" id="reg-link" placeholder="https://vk.com/ваш_ник">
        <label>Придумайте пароль:</label>
        <input type="password" id="reg-pass" placeholder="Ваш пароль">
        <button type="button" onclick="registerUser()" style="margin-top: 20px;">Зарегистрироваться</button>
        <div class="role-switch"><a onclick="toggleScreen('main')">← Назад</a></div>
    </section>

    <!-- ЭКРАН ВХОДА ДИРЕКТОРА -->
    <section id="director-screen" class="hidden">
        <h1>Вход для Директора</h1>
        <label>Кодовое слово:</label>
        <input type="password" id="dir-pass" placeholder="Кодовое слово">
        <button type="button" onclick="loginDirector()" style="margin-top:20px;">Войти</button>
        <div class="role-switch"><a onclick="toggleScreen('main')">← Назад</a></div>
    </section>

    <!-- ЛИЧНЫЙ КАБИНЕТ (СВОЙ И СТУДЕНТОВ) -->
    <section id="cabinet" class="cabinet hidden">
        <header class="cabinet-top">
            <span class="eyebrow" id="header-title">Хогвартс / Досье</span>
            <div id="header-buttons">
                <button id="btn-edit" class="text-button" style="color:var(--primary); margin-right:15px;">✏️ Настройки</button>
                <button id="logout-btn" class="text-button" style="color:#ff5555;">Выйти</button>
            </div>
        </header>
        
        <div class="character">
            <div class="portrait-wrap"><div id="portrait-empty">✦</div></div>
            <div class="character-info">
                <p id="room-name" class="eyebrow"></p>
                <h1 id="cabinet-title"></h1>
                <p id="cabinet-role" class="character-subtitle"></p>
                <div class="character-details">
                    <span>Ссылка ВК <strong id="saved-link"></strong></span>
                    <span>Пароль <strong id="saved-pass"></strong></span>
                </div>
            </div>
        </div>
        
        <div class="resources">
            <div><label><span>Опыт · XP</span></label><strong id="xp">0</strong></div>
            <div><label><span>Мана · MP</span></label><strong id="mana">0</strong></div>
        </div>

        <div class="book-header">
            <span class="eyebrow">Знания, Сила и Инвентарь</span>
            <h2>Книга персонажа</h2>
        </div>

        <nav class="tabs">
            <button data-page="skills" class="tab-btn active-tab" onclick="renderTabs('skills')">Навыки</button>
            <button data-page="spells" class="tab-btn" onclick="renderTabs('spells')">Заклинания</button>
            <button data-page="potions" class="tab-btn" onclick="renderTabs('potions')">Зелья</button>
            <button data-page="notes" class="tab-btn" onclick="renderTabs('notes')">Заметки</button>
            <button data-page="director" id="director-tab" class="tab-btn hidden" onclick="renderTabs('director')">👑 База данных</button>
        </nav>
        
        <section id="book-content"></section>
    </section>

    <!-- НАСТРОЙКИ ПРОФИЛЯ -->
    <section id="settings-screen" class="hidden">
        <h1>Настройки профиля</h1>
        <label>Новое имя:</label>
        <input type="text" id="set-name">
        <label>Новая ссылка на ВК:</label>
        <input type="text" id="set-link">
        <label>Новый пароль:</label>
        <input type="password" id="set-pass" placeholder="Оставьте пустым, если не меняете">
        <button type="button" onclick="saveSettings()" style="margin-top:20px;">Сохранить</button>
        <div class="role-switch"><a onclick="backToCabinet()">← Отмена</a></div>
    </section>
</main>

<script>
    const DB_URL = "https://hogwartscr-default-rtdb.europe-west1.firebasedatabase.app";
    const DIRECTOR_ID = 836264843; 
    const DIRECTOR_SECRET = "коньяк"; 
    
    let vkUser = null;
    let studentProfile = null; // Текущий профиль (свой)
    let viewingProfile = null; // Профиль, который открыт для просмотра (если Директор)
    let viewingId = null;
    let allStudents = {};
    let isDirectorViewing = false;
    let activeTab = 'skills';

    const $ = id => document.getElementById(id);

    if (window.vkBridge) {
        vkBridge.send('VKWebAppInit').then(() => vkBridge.send('VKWebAppGetUserInfo')).then(info => {
            vkUser = info;
            $('loading').classList.add('hidden');
            toggleScreen('main');
        });
    }

    function toggleScreen(screen) {
        ['main-menu', 'login-screen', 'register-screen', 'director-screen', 'cabinet', 'settings-screen'].forEach(s => $(s).classList.add('hidden'));
        $(screen).classList.remove('hidden');
        if(screen === 'main-menu') $('loading').classList.add('hidden');
    }

    window.openLogin = () => toggleScreen('login-screen');
    window.openRegister = () => toggleScreen('register-screen');
    window.openDirectorLogin = () => toggleScreen('director-screen');

    // ВХОД / РЕГИСТРАЦИЯ
    window.loginUser = async () => {
        const pass = $('login-pass').value.trim();
        try {
            const res = await fetch(DB_URL + "/students/" + vkUser.id + ".json");
            const data = await res.json();
            if (data && data.secretCode === pass) {
                studentProfile = data;
                renderProfile(data, false);
            } else {
                $('login-error').style.display = 'block';
            }
        } catch(e) { $('login-error').style.display = 'block'; }
    };

    window.registerUser = async () => {
        const profile = {
            id: vkUser.id, name: $('reg-name').value.trim(), vkLink: $('reg-link').value.trim(), 
            role: $('reg-role').value, secretCode: $('reg-pass').value.trim(), 
            xp: 0, mana: 0, skills: [], spells: [], potions: [], notes: ""
        };
        if(!profile.name || !profile.secretCode) return alert("Заполните поля!");
        await fetch(DB_URL + "/students/" + vkUser.id + ".json", { method: 'PUT', body: JSON.stringify(profile) });
        studentProfile = profile;
        renderProfile(profile, false);
    };

    window.loginDirector = async () => {
        if (vkUser.id !== DIRECTOR_ID) return alert("Вы не Директор!");
        if ($('dir-pass').value.trim() !== DIRECTOR_SECRET) return alert("Неверное кодовое слово!");
        
        const profile = {
            id: vkUser.id, name: "Теодор Нотт", vkLink: "https://vk.ru/nott_cr", 
            role: 'director', secretCode: "admin", xp: 9999, mana: 9999, 
            skills: [{title: "Травология", desc: "Профессор Травологии", status: "Изучено"}], spells: [], potions: [], notes: ""
        };
        await fetch(DB_URL + "/students/" + vkUser.id + ".json", { method: 'PUT', body: JSON.stringify(profile) });
        studentProfile = profile;
        renderProfile(profile, false);
    };

    $('logout-btn').onclick = () => { location.reload(); }; // Простой выход

    // ОТОБРАЖЕНИЕ ПРОФИЛЯ
    function renderProfile(data, isAdminView) {
        viewingProfile = data;
        toggleScreen('cabinet');
        isDirectorViewing = isAdminView;

        $('cabinet-title').textContent = data.name;
        $('cabinet-role').textContent = data.role === 'director' ? '👑 Директор' : (data.role === 'professor' ? '📖 Профессор' : '🎓 Студент');
        $('saved-link').textContent = data.vkLink || '—';
        $('saved-pass').textContent = isAdminView || data.role === 'director' ? (data.secretCode || 'admin') : '******'; 
        $('xp').textContent = data.xp || 0;
        $('mana').textContent = data.mana || 0;
        $('room-name').textContent = 'Гостиная · ' + (data.faculty || 'Хогвартс');

        if (isAdminView) {
            $('header-title').textContent = "РЕЖИМ ДИРЕКТОРА / " + data.name;
            $('header-buttons').innerHTML = `<button onclick="backToAdminBase()" class="text-button" style="color:var(--primary);">← Назад в базу</button>`;
        } else {
            $('header-title').textContent = "Хогвартс / Досье";
            $('header-buttons').innerHTML = `
                <button id="btn-edit" class="text-button" style="color:var(--primary); margin-right:15px;" onclick="openSettings()">✏️ Настройки</button>
                <button class="text-button" style="color:#ff5555;" onclick="location.reload()">Выйти</button>
            `;
        }

        if (data.role === 'director' && !isAdminView) {
            $('director-tab').classList.remove('hidden');
        } else {
            $('director-tab').classList.add('hidden');
        }

        renderTabs(activeTab);
    }

    function renderTabs(tab) {
        activeTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.page === tab));
        const root = $('book-content');
        
        if (tab === 'skills') {
            let html = `<div class="skills-grid">`;
            if (viewingProfile.skills && viewingProfile.skills.length > 0) {
                viewingProfile.skills.forEach((s, i) => {
                    html += `
                    <div class="skill-card">
                        <h3>✦ ${s.title}</h3>
                        <p>${s.desc}</p>
                        <div class="status">${s.status || 'Изучено'}</div>
                        ${isDirectorViewing ? `<button onclick="deleteItem('skills', ${i})" style="border-color:#ff5555; color:#ff5555; cursor:pointer;">Удалить навык</button>` : `<button disabled>Изучено</button>`}
                    </div>`;
                });
            } else {
                html += `<p class="hint">Навыков пока нет.</p>`;
            }
            html += `</div>`;
            if (isDirectorViewing) html += getBuilderHTML('skills', 'Навык');
            root.innerHTML = html;
        }
        else if (tab === 'spells') {
            let html = `<div class="skills-grid">`;
            if (viewingProfile.spells && viewingProfile.spells.length > 0) {
                viewingProfile.spells.forEach((s, i) => {
                    html += `<div class="skill-card"><h3>⚡ ${s.title}</h3><p>${s.desc}</p>${isDirectorViewing ? `<button onclick="deleteItem('spells', ${i})" style="border-color:#ff5555; color:#ff5555; cursor:pointer;">Удалить</button>` : ''}</div>`;
                });
            } else { html += `<p class="hint">Заклинаний пока нет.</p>`; }
            html += `</div>`;
            if (isDirectorViewing) html += getBuilderHTML('spells', 'Заклинание');
            root.innerHTML = html;
        }
        else if (tab === 'potions') {
            let html = `<div class="skills-grid">`;
            if (viewingProfile.potions && viewingProfile.potions.length > 0) {
                viewingProfile.potions.forEach((s, i) => {
                    html += `<div class="skill-card"><h3>🧪 ${s.title}</h3><p>${s.desc}</p>${isDirectorViewing ? `<button onclick="deleteItem('potions', ${i})" style="border-color:#ff5555; color:#ff5555; cursor:pointer;">Удалить</button>` : ''}</div>`;
                });
            } else { html += `<p class="hint">Зелий пока нет.</p>`; }
            html += `</div>`;
            if (isDirectorViewing) html += getBuilderHTML('potions', 'Зелье');
            root.innerHTML = html;
        }
        else if (tab === 'notes') {
            root.innerHTML = `<div class="skill-card"><p>${viewingProfile.notes || 'Заметок пока нет.'}</p></div>`;
            if (isDirectorViewing) root.innerHTML += `<div class="builder-box"><label>Изменить заметки:</label><textarea id="edit-notes" rows="5">${viewingProfile.notes||''}</textarea><button onclick="saveNotes()">Сохранить заметки</button></div>`;
        }
        else if (tab === 'director') {
            loadDirectorBase();
        }
    }

    // ФОРМА-КОНСТРУКТОР ДЛЯ ДИРЕКТОРА
    function getBuilderHTML(type, name) {
        return `
        <div class="builder-box">
            <h3 style="color:var(--primary);">Добавить ${name}</h3>
            <label>Название:</label>
            <input type="text" id="add-title" placeholder="Например: Экспекто Патронум">
            <label>Описание:</label>
            <textarea id="add-desc" rows="3" placeholder="Что это дает..."></textarea>
            <button onclick="addItem('${type}')" style="background: #4CAF50; color: white; margin-top: 10px;">Добавить в профиль</button>
        </div>`;
    }

    window.addItem = async (type) => {
        const title = $('add-title').value.trim();
        const desc = $('add-desc').value.trim();
        if (!title) return alert("Введите название!");

        if (!viewingProfile[type]) viewingProfile[type] = [];
        viewingProfile[type].push({ title: title, desc: desc, status: 'Изучено' });

        await fetch(DB_URL + "/students/" + viewingProfile.id + ".json", { method: 'PATCH', body: JSON.stringify({ [type]: viewingProfile[type] }) });
        renderTabs(type);
    };

    window.deleteItem = async (type, index) => {
        if (!confirm("Удалить эту запись?")) return;
        viewingProfile[type].splice(index, 1);
        await fetch(DB_URL + "/students/" + viewingProfile.id + ".json", { method: 'PATCH', body: JSON.stringify({ [type]: viewingProfile[type] }) });
        renderTabs(type);
    };

    window.saveNotes = async () => {
        const text = $('edit-notes').value;
        viewingProfile.notes = text;
        await fetch(DB_URL + "/students/" + viewingProfile.id + ".json", { method: 'PATCH', body: JSON.stringify({ notes: text }) });
        alert("Заметки обновлены!");
    };

    // БАЗА ДАННЫХ (ДЛЯ ДИРЕКТОРА)
    function loadDirectorBase() {
        fetch(DB_URL + "/students.json").then(r => r.json()).then(data => {
            allStudents = data || {};
            let html = `<h2>Все учетные записи</h2><div class="admin-panel">`;
            Object.values(allStudents).forEach(student => {
                html += `
                <div class="admin-card">
                    <h3>${student.name} <span style="font-size:12px; color:var(--primary);">(${student.role})</span></h3>
                    <p style="font-size:13px; margin:5px 0;">ВК: <a href="${student.vkLink}" target="_blank" style="color:var(--accent);">${student.vkLink}</a></p>
                    <span style="font-size:12px;">XP: ${student.xp || 0} | MP: ${student.mana || 0}</span>
                    <div style="margin-top: 15px;">
                        <button onclick="adminViewStudent('${student.id}')" style="background:var(--primary); color:var(--bg);">🚪 Зайти в комнату</button>
                    </div>
                </div>`;
            });
            html += `</div>`;
            $('book-content').innerHTML = html;
        });
    }

    window.adminViewStudent = async (id) => {
        viewingId = id;
        renderProfile(allStudents[id], true); // true = isAdminView
    };

    window.backToAdminBase = () => {
        renderProfile(studentProfile, false); // Возвращаемся в свой профиль Директора
        document.querySelector('[data-page="director"]').click(); // И переключаем на вкладку базы
    };

    // НАСТРОЙКИ СВОЕГО ПРОФИЛЯ
    window.openSettings = () => {
        $('set-name').value = studentProfile.name;
        $('set-link').value = studentProfile.vkLink || '';
        $('set-pass').value = '';
        toggleScreen('settings-screen');
    };

    window.saveSettings = async () => {
        const newPass = $('set-pass').value.trim();
        studentProfile.name = $('set-name').value.trim();
        studentProfile.vkLink = $('set-link').value.trim();
        if (newPass) studentProfile.secretCode = newPass;
        await fetch(DB_URL + "/students/" + studentProfile.id + ".json", { method: 'PUT', body: JSON.stringify(studentProfile) });
        alert("Сохранено!");
        renderProfile(studentProfile, false);
    };

    window.backToCabinet = () => renderProfile(studentProfile, false);
</script>
</body>
</html>
