<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хогвартс ВГП</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <!-- Подключаем Firebase -->
    <script src="https://cdn.jsdelivr.net/npm/firebase@9.0.0/firebase-app-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/firebase@9.0.0/firebase-database-compat.js"></script>
    
    <style>
        /* ВАША НОВАЯ ПАЛИТРА */
        :root {
            --primary: #BEA7B9;     /* Светлый розово-фиолетовый (текст, кнопки) */
            --accent: #975F8F;      /* Яркий фиолетовый (акценты, ховеры) */
            --dark-accent: #48294E; /* Темно-фиолетовый */
            --panel: #1F1B3D;       /* Фон карточек */
            --bg: #161228;          /* Основной фон страницы */
            --text: #EADCE6;        /* Светлый текст */
        }
        
        *{box-sizing:border-box}
        body{
            font-family:Georgia,'Times New Roman',serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            padding:36px 20px;
            background-attachment:fixed;
            background-size:cover;
            background-position:center
        }
        
        .container{
            max-width:600px;
            padding:30px;
            background:var(--panel);
            border:1px solid var(--dark-accent);
            border-radius:8px;
            box-shadow:0 24px 100px rgba(0,0,0,0.8);
            margin: 0 auto;
        }
        
        .in-cabinet .container{
            max-width:1100px;
            padding:32px 40px;
            background:linear-gradient(120deg, rgba(31,27,61,0.95), rgba(22,18,40,0.98));
            backdrop-filter:blur(5px);
            border: 1px solid var(--accent);
        }

        h1,h2,h3{font-weight:normal;color:var(--primary);margin-top:0}
        h2{font-size:30px;margin:8px 0}
        
        button{
            background:var(--primary);
            color:var(--bg);
            border-radius:4px;
            font-family:inherit;
            font-weight:bold;
            transition:all .2s;
            padding:14px;
            border:none;
            cursor:pointer;
            width:100%;
            margin-top:15px;
            font-size: 16px;
        }
        
        button:hover{background:var(--accent); color:white;}
        button:active{transform:translateY(1px)}
        button:disabled{cursor:not-allowed;opacity:.5}
        
        input,select,textarea{
            font-family:inherit;
            background:rgba(0,0,0,0.2);
            color:var(--text);
            border:1px solid var(--accent);
            border-radius:4px;
            padding:12px;
            font-size:16px;
            width:100%;
            margin-top:5px
        }
        
        select option{background:var(--panel)}
        label{color:var(--primary);font-weight:normal;display:block;margin-top:15px}
        
        .cabinet-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--dark-accent);padding-bottom:18px;gap:10px}
        .eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
        
        .text-button{width:auto;margin:0;padding:8px 0;background:transparent;color:var(--primary);font-size:14px}
        .text-button:hover{background:transparent;color:var(--accent)}
        
        .character{display:grid;grid-template-columns:180px 1fr;gap:34px;margin:32px 0 16px;align-items:center}
        .portrait-wrap{height:230px;position:relative;border:1px solid var(--accent);padding:6px;background:var(--bg);box-shadow:0 0 15px rgba(151,95,143,0.3)}
        #portrait-empty{height:100%;display:grid;place-items:center;font-size:76px;color:var(--accent);background:radial-gradient(ellipse at 50% 40%,#48294E55,#161228)}
        
        .cabinet h1{font-size:42px;line-height:1.15;margin:0;color:var(--primary)}
        .character-subtitle{font-size:14px;color:var(--accent);line-height:1.5}
        
        .character-details{display:flex;gap:26px;flex-wrap:wrap;margin:24px 0 10px}
        .character-details span{font-size:12px;color:var(--muted); color: var(--accent);}
        .character-details strong{display:block;font-size:15px;font-weight:normal;color:var(--text);margin-top:7px}
        
        .resources{
            display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:24px;
            padding:22px 24px;background:rgba(72,41,78,0.3);border:1px solid var(--accent);
            border-left:4px solid var(--primary);margin:22px 0 38px;border-radius:4px;
        }
        .resources label{margin:0;display:flex;justify-content:space-between}
        .resources label span{font-size:11px;letter-spacing:2px;color:var(--primary)}
        .resources input{font-size:28px;color:var(--primary);border:0;border-bottom:2px solid var(--accent);padding:4px 0;background:none;border-radius:0}
        
        .tabs{display:flex;gap:26px;border-bottom:1px solid var(--dark-accent);margin:24px 0}
        .tabs button{border-radius:0;width:auto;background:none;color:var(--accent);font-size:16px;padding:12px 0;margin:0;border-bottom:2px solid transparent}
        .tabs button[aria-pressed=true]{color:var(--primary);border-color:var(--primary)}
        
        .school-panel{padding:24px;border:1px solid var(--accent);margin:20px 0;background:rgba(72,41,78,0.2);border-radius:6px;}
        .school-panel button{width:auto;margin:12px 12px 0 0; padding: 10px 15px;}
        
        .hint{font-size:14px;color:var(--accent);line-height:1.7;}
        
        .location{
            min-height:150px;text-align:left;padding:24px;border:1px solid var(--accent);
            background:linear-gradient(130deg, rgba(72,41,78,0.4), rgba(31,27,61,0.8));
            color:var(--text);margin:0;border-radius:4px;
        }
        .location:hover {border-color: var(--primary);}
        .location b{display:block;font-size:24px;font-weight:normal;margin-bottom:15px;color:var(--primary);}
    </style>
</head>
<body>

<main class="container">
    <div id="loading" style="text-align:center; padding: 50px 0; color: var(--primary); font-size: 18px;">🔮 Загрузка магии...</div>

    <!-- КАРТОЧКА СТУДЕНТА -->
    <section id="student-profile" hidden>
        <h1>Карточка студента</h1>
        <p class="hint">Добро пожаловать! Заполните данные один раз, и они сохранятся в базе школы.</p>
        <label>Имя персонажа:</label>
        <input type="text" id="charName" placeholder="Например: Теодор Нотт">
        <label>Факультет:</label>
        <select id="faculty">
            <option value="Гриффиндор">🦁 Гриффиндор</option>
            <option value="Слизерин">🐍 Слизерин</option>
            <option value="Когтевран">🦅 Когтевран</option>
            <option value="Пуффендуй">🦡 Пуффендуй</option>
        </select>
        <label>Волшебная палочка:</label>
        <input type="text" id="wand" placeholder="Древесина и сердцевина">
        <label>Патронус:</label>
        <input type="text" id="patronus" placeholder="Ваше животное">
        <button type="button" id="save-profile">Сохранить профиль</button>
    </section>

    <!-- ЛИЧНЫЙ КАБИНЕТ -->
    <section id="cabinet" class="cabinet" hidden>
        <header class="cabinet-top">
            <span class="eyebrow">Хогвартс / Досье</span>
        </header>
        
        <div class="character">
            <div class="portrait-wrap">
                <div id="portrait-empty">✦</div>
            </div>
            <div class="character-info">
                <p id="room-name" class="eyebrow"></p>
                <h1 id="cabinet-title"></h1>
                <p class="character-subtitle">Студент школы чародейства и волшебства</p>
                <div class="character-details">
                    <span>Палочка <strong id="saved-wand"></strong></span>
                    <span>Патронус <strong id="saved-patronus"></strong></span>
                </div>
                <button id="edit-profile" class="text-button">✏️ Изменить анкету</button>
            </div>
        </div>
        
        <div class="resources">
            <div><label>Опыт · XP</label><strong id="xp" style="font-size:36px;color:var(--primary);">0</strong></div>
            <div><label>Мана · MP</label><strong id="mana" style="font-size:36px;color:var(--primary);">0</strong></div>
        </div>

        <nav class="tabs">
            <button data-page="world" aria-pressed="true">Замок</button>
            <button data-page="director" id="director-tab" hidden>👑 Кабинет директора</button>
        </nav>
        <section id="school-content"></section>
    </section>
</main>

<script>
    // ==========================================
    // 1. ИНИЦИАЛИЗАЦИЯ FIREBASE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyBe4V7S106dXf5uS9-Y-wHP7ZOUH0_VX1Q",
        authDomain: "hogwartscr.firebaseapp.com",
        databaseURL: "https://hogwartscr-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hogwartscr",
        storageBucket: "hogwartscr.firebasestorage.app",
        messagingSenderId: "79365001784",
        appId: "1:79365001784:web:9ec8447b3825b2d277c7d",
        measurementId: "G-73DK3E75WM"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ВАШ VK ID (Директор)
    const DIRECTOR_ID = 836264843; 

    // ==========================================
    // 2. ЛОГИКА АВТОМАТИЧЕСКОГО ВХОДА
    // ==========================================
    let vkUser = null;
    let studentProfile = null;
    let allStudents = {};

    const $ = id => document.getElementById(id);
    
    function show(id) {
        $('loading').hidden = true;
        ['student-profile', 'cabinet'].forEach(s => $(s).hidden = s !== id);
        document.body.classList.toggle('in-cabinet', id === 'cabinet');
        window.scrollTo(0,0);
    }

    if (window.vkBridge) {
        vkBridge.send('VKWebAppInit').then(() => {
            autoLogin();
        });
    } else {
        $('loading').innerText = "Ошибка: Откройте приложение через ВКонтакте!";
    }

    async function autoLogin() {
        try {
            const info = await vkBridge.send('VKWebAppGetUserInfo');
            vkUser = info;
            initApp();
        } catch (e) { 
            $('loading').innerText = "Ошибка авторизации ВК."; 
        }
    }

    async function initApp() {
        if (vkUser.id === DIRECTOR_ID) {
            $('director-tab').hidden = false;
        }

        db.ref('/').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            allStudents = data.students || {};
            studentProfile = allStudents[vkUser.id];

            if (studentProfile) {
                renderCabinet();
            } else {
                show('student-profile'); 
            }
        });
    }

    // ==========================================
    // 3. СОХРАНЕНИЕ И ОТОБРАЖЕНИЕ
    // ==========================================
    $('save-profile').onclick = () => {
        const name = $('charName').value;
        if (!name) return alert("Введите имя!");
        
        const profile = {
            id: vkUser.id,
            name: name,
            faculty: $('faculty').value,
            wand: $('wand').value,
            patronus: $('patronus').value,
            xp: studentProfile?.xp || 0,
            mana: studentProfile?.mana || 0,
            role: vkUser.id === DIRECTOR_ID ? 'director' : 'student'
        };

        db.ref('students/' + vkUser.id).set(profile);
        alert("Профиль сохранен! Добро пожаловать.");
    };

    $('edit-profile').onclick = () => {
        $('charName').value = studentProfile.name;
        $('faculty').value = studentProfile.faculty;
        $('wand').value = studentProfile.wand || '';
        $('patronus').value = studentProfile.patronus || '';
        show('student-profile');
    };

    function renderCabinet() {
        $('cabinet-title').textContent = studentProfile.name;
        $('saved-wand').textContent = studentProfile.wand || 'Не указана';
        $('saved-patronus').textContent = studentProfile.patronus || 'Неизвестен';
        $('xp').textContent = studentProfile.xp || 0;
        $('mana').textContent = studentProfile.mana || 0;
        $('room-name').textContent = 'Гостиная · ' + studentProfile.faculty;
        show('cabinet');
        renderPage('world');
    }

    // ==========================================
    // 4. ВКЛАДКИ И ПАНЕЛЬ ДИРЕКТОРА
    // ==========================================
    document.querySelectorAll('[data-page]').forEach(btn => {
        btn.onclick = () => renderPage(btn.dataset.page);
    });

    function renderPage(page) {
        document.querySelectorAll('[data-page]').forEach(b => b.setAttribute('aria-pressed', b.dataset.page === page));
        const root = $('school-content');

        if (page === 'world') {
            root.innerHTML = `<h2>Учебные кабинеты</h2>
            <p class="hint">Здесь будут появляться лекции от преподавателей.</p>
            <div class="locations">
                <button class="location"><span>01</span><b>Кабинет заклинаний</b><span>В разработке ↗</span></button>
                <button class="location"><span>02</span><b>Класс зельеварения</b><span>В разработке ↗</span></button>
            </div>`;
        } else if (page === 'director') {
            if (vkUser.id !== DIRECTOR_ID) return; 
            renderDirector(root);
        }
    }

    function renderDirector(root) {
        root.innerHTML = `<h2>Кабинет директора</h2>
        <p class="hint">Вы можете управлять успеваемостью студентов. Только вы видите эту панель.</p>
        <h3>Список студентов</h3>
        ${Object.values(allStudents).map(s => `
            <div class="school-panel">
                <p><strong>${s.name}</strong> (${s.faculty}) — ${s.xp} XP / ${s.mana} MP</p>
                <button onclick="giveXP('${s.id}', 10)">+10 XP</button>
                <button onclick="giveXP('${s.id}', -10)" style="background:var(--dark-accent); color:white;">-10 XP</button>
            </div>
        `).join('')}`;
    }

    window.giveXP = (studentId, amount) => {
        db.ref('students/' + studentId + '/xp').transaction(current => {
            const newValue = (current || 0) + amount;
            return newValue < 0 ? 0 : newValue; 
        });
    };

</script>
</body>
</html>
