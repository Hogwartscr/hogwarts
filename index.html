<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хогвартс ВГП</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        :root { --primary: #BEA7B9; --accent: #975F8F; --dark-accent: #48294E; --panel: #1F1B3D; --bg: #161228; --text: #EADCE6; }
        *{box-sizing:border-box}
        body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px; margin: 0;}
        .container{max-width:1100px;padding:30px 40px;background:linear-gradient(120deg, rgba(31,27,61,0.95), rgba(22,18,40,0.98));border: 1px solid var(--accent);border-radius:8px;margin: 0 auto; box-shadow: 0 24px 100px rgba(0,0,0,0.8);}
        
        h1,h2,h3{font-weight:normal;color:var(--primary);margin-top:0;}
        button{background:var(--primary);color:var(--bg);border-radius:4px;font-family:inherit;font-weight:bold;transition:all .2s;padding:10px 15px;border:none;cursor:pointer;font-size: 14px;}
        button:hover{background:var(--accent); color:white;}
        input,select,textarea{font-family:inherit;background:rgba(0,0,0,0.2);color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:10px;font-size:14px;width:100%;margin-top:5px}
        select option{background:var(--panel)}
        label{color:var(--primary);font-weight:normal;display:block;margin-top:12px; font-size:14px;}
        
        .cabinet-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--dark-accent);padding-bottom:18px;gap:10px; flex-wrap: wrap;}
        .eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
        .text-button{width:auto;margin:0;padding:8px 0;background:transparent;color:var(--primary);font-size:14px; margin-right: 10px;}
        
        .character{display:grid;grid-template-columns:150px 1fr;gap:30px;margin:20px 0 16px;align-items:center}
        .portrait-wrap{height:180px;width:150px;position:relative;border:1px solid var(--accent);padding:6px;background:var(--bg);box-shadow:0 0 15px rgba(151,95,143,0.3); border-radius: 4px;}
        .portrait-wrap img{width:100%; height:100%; object-fit:cover; border-radius: 2px;}
        #portrait-empty{height:100%;display:grid;place-items:center;font-size:60px;color:var(--accent);background:radial-gradient(ellipse at 50% 40%,#48294E55,#161228)}
        
        .cabinet h1{font-size:38px;line-height:1.15;margin:0;color:var(--primary);}
        .character-details{display:flex;gap:26px;flex-wrap:wrap;margin:15px 0 10px}
        .character-details span{font-size:12px; color: var(--accent);}
        .character-details strong{display:block;font-size:15px;font-weight:normal;color:var(--text);margin-top:7px; word-break: break-all;}
        
        .resources{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;padding:20px;background:rgba(72,41,78,0.3);border:1px solid var(--accent);border-left:4px solid var(--primary);margin:20px 0 30px;border-radius:4px;}
        .resources label{margin:0;display:flex;justify-content:space-between}
        .resources strong{display:block;font-size:32px;color:var(--primary);margin-top:5px}
        
        .book-header { margin-top: 30px; border-top: 1px solid var(--dark-accent); padding-top: 20px; }
        .tabs{display:flex;gap:20px;border-bottom:1px solid var(--dark-accent);margin:20px 0; flex-wrap:wrap;}
        .tabs button{border-radius:0;width:auto;background:none;color:var(--accent);font-size:16px;padding:10px 0;margin:0;border-bottom:2px solid transparent}
        .tabs button.active{color:var(--primary);border-color:var(--primary); font-weight:bold;}
        
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .skill-card { border: 1px solid var(--accent); background: rgba(31,27,61,0.6); padding: 20px; border-radius: 4px; display: flex; flex-direction: column; }
        .skill-card h3 { color: var(--primary); font-size: 20px; margin: 0 0 10px 0; }
        .skill-card p { font-size: 14px; color: var(--text); line-height: 1.5; margin-bottom: 20px; flex-grow: 1; white-space: pre-wrap;}
        
        .admin-panel { display: grid; gap: 15px; margin-top: 20px;}
        .admin-card { padding: 15px; border: 1px solid var(--accent); border-radius: 6px; background: rgba(72,41,78,0.2); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;}
        .builder-box { border: 1px dashed var(--primary); padding: 20px; margin-top: 20px; border-radius: 6px; background: rgba(0,0,0,0.2); }
        
        .center-menu { text-align: center; padding: 50px 20px; }
        .center-menu button { max-width: 400px; margin: 10px auto; display: block; }
        .hidden { display: none !important; }

        /* Стили для чата */
        .chat-container { border: 1px solid var(--accent); border-radius: 6px; padding: 15px; margin-top: 15px; background: rgba(0,0,0,0.3); }
        .chat-messages { height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding-right: 10px;}
        .msg { padding: 10px; border-radius: 8px; max-width: 80%; font-size: 14px; word-wrap: break-word;}
        .msg.my { background: var(--accent); color: white; align-self: flex-end; }
        .msg.their { background: var(--dark-accent); color: var(--text); align-self: flex-start; }
        .msg img { max-width: 100%; border-radius: 4px; margin-top: 5px; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { margin: 0; }
        .chat-input-area button { margin: 0; }
    </style>
</head>
<body>

<div id="loading" class="center-menu" style="color: var(--primary); font-size: 18px;">🔮 Загрузка...</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="main-menu" class="center-menu hidden">
    <h1>Хогвартс ВГП</h1>
    <button onclick="showLogin()" style="margin-top: 30px;">🔑 Войти</button>
    <button onclick="showRegister()" style="margin-top: 15px; background: transparent; border: 1px solid var(--primary); color: var(--primary);">📝 Регистрация</button>
    <button onclick="showDirectorLogin()" style="margin-top: 30px; background: #99564b; color: white;">👑 Вход для Директора</button>
</div>

<!-- ВХОД -->
<div id="login-screen" class="center-menu hidden" style="max-width: 400px; margin: 0 auto;">
    <h1>Вход в профиль</h1>
    <label>Ваш пароль:</label><input type="password" id="login-pass" placeholder="Пароль">
    <button onclick="doLogin()" style="margin-top:20px;">Войти</button>
    <p id="login-error" style="color: #ff5555; font-size: 13px; margin-top: 10px; display: none;">Неверный пароль!</p>
    <a onclick="showMenu()" class="text-button" style="display:block; margin-top:20px;">← Назад</a>
</div>

<!-- РЕГИСТРАЦИЯ -->
<div id="register-screen" class="center-menu hidden" style="max-width: 400px; margin: 0 auto;">
    <h1>Регистрация</h1>
    <label>Ваша роль:</label>
    <select id="reg-role"><option value="student">Студент</option><option value="professor">Профессор</option></select>
    <label>Имя персонажа:</label><input type="text" id="reg-name" placeholder="Имя">
    <label>Ссылка на ВК:</label><input type="text" id="reg-link" placeholder="https://vk.com/...">
    <label>Пароль:</label><input type="password" id="reg-pass" placeholder="Пароль">
    <button onclick="doRegister()" style="margin-top: 20px;">Создать</button>
    <a onclick="showMenu()" class="text-button" style="display:block; margin-top:20px;">← Назад</a>
</div>

<!-- ВХОД ДИРЕКТОРА -->
<div id="director-screen" class="center-menu hidden" style="max-width: 400px; margin: 0 auto;">
    <h1>Вход для Директора</h1>
    <label>Кодовое слово:</label><input type="password" id="dir-pass" placeholder="коньяк">
    <button onclick="doDirectorLogin()" style="margin-top:20px;">Войти</button>
    <a onclick="showMenu()" class="text-button" style="display:block; margin-top:20px;">← Назад</a>
</div>

<!-- ФОРМА РЕДАКТИРОВАНИЯ -->
<div id="edit-screen" class="center-menu hidden" style="max-width: 400px; margin: 0 auto;">
    <h1 id="edit-title">Редактирование</h1>
    <label>Имя:</label><input type="text" id="edit-name">
    <label>Ссылка ВК:</label><input type="text" id="edit-link">
    <label>Пароль:</label><input type="text" id="edit-pass">
    <label>Фото (ссылка на картинку):</label><input type="text" id="edit-photo" placeholder="https://...">
    <button onclick="saveEdit()" style="margin-top:20px; background:#4CAF50; color:white;">Сохранить</button>
    <a onclick="cancelEdit()" class="text-button" style="display:block; margin-top:20px;">← Отмена</a>
</div>

<!-- КАБИНЕТ -->
<div id="cabinet" class="container cabinet hidden">
    <header class="cabinet-top">
        <span class="eyebrow" id="header-title">Хогвартс / Досье</span>
        <div id="header-buttons">
            <button class="text-button" style="color:#ff5555;" onclick="location.reload()">Выйти</button>
        </div>
    </header>
    
    <div class="character">
        <div class="portrait-wrap">
            <div id="portrait-empty">✦</div>
            <img id="avatar-img" class="hidden" src="" alt="Avatar">
        </div>
        <div class="character-info">
            <p id="room-name" class="eyebrow"></p>
            <h1 id="cabinet-title"></h1>
            <p id="cabinet-role" class="character-subtitle"></p>
            <div class="character-details">
                <span>Ссылка ВК <strong id="saved-link"></strong></span>
                <span>Пароль <strong id="saved-pass"></strong></span>
            </div>
            <div id="visit-actions" class="hidden" style="margin-top: 15px;">
                <button onclick="startChatFromProfile()" style="background: var(--accent); color: white;">🦉 Написать сову</button>
            </div>
        </div>
    </div>
    
    <div class="resources">
        <div><label><span>XP</span></label><strong id="xp">0</strong></div>
        <div><label><span>MP</span></label><strong id="mana">0</strong></div>
    </div>

    <div class="book-header">
        <h2>Книга персонажа</h2>
    </div>

    <!-- ВКЛАДКИ -->
    <nav class="tabs">
        <button data-tab="skills" class="active" onclick="switchTab('skills')">Навыки</button>
        <button data-tab="spells" onclick="switchTab('spells')">Заклинания</button>
        <button data-tab="potions" onclick="switchTab('potions')">Зелья</button>
        <button data-tab="diary" onclick="switchTab('diary')">📖 Дневник</button>
        <button data-tab="homework" onclick="switchTab('homework')">📝 ДЗ</button>
        <!-- ЭТА ВКЛАДКА ТЕПЕРЬ ДЛЯ ВСЕХ -->
        <button data-tab="students" onclick="switchTab('students')">👥 База профилей</button>
        <button data-tab="messages" onclick="switchTab('messages')">🦉 Совы</button>
    </nav>
    
    <section id="book-content"></section>
</div>

<script>
    const DB_URL = "https://hogwartscr-default-rtdb.europe-west1.firebasedatabase.app";
    const DIRECTOR_ID = 836264843; 
    const DIRECTOR_SECRET = "коньяк"; 
    
    let vkUser = null;
    let myProfile = null;     
    let viewProfile = null;   
    let isAdminView = false;
    let isGuestView = false;
    let currentChatId = null;
    let chatListener = null;

    if (window.vkBridge) {
        vkBridge.send('VKWebAppInit').then(() => vkBridge.send('VKWebAppGetUserInfo')).then(info => {
            vkUser = info;
            document.getElementById('loading').style.display = 'none';
            showMenu();
        }).catch(e => alert("Ошибка ВК: " + e.message));
    }

    function hideAll() {
        ['main-menu', 'login-screen', 'register-screen', 'director-screen', 'cabinet', 'edit-screen'].forEach(id => document.getElementById(id).classList.add('hidden'));
    }
    function showMenu() { hideAll(); document.getElementById('main-menu').classList.remove('hidden'); }
    function showLogin() { hideAll(); document.getElementById('login-screen').classList.remove('hidden'); }
    function showRegister() { hideAll(); document.getElementById('register-screen').classList.remove('hidden'); }
    function showDirectorLogin() { hideAll(); document.getElementById('director-screen').classList.remove('hidden'); }

    async function doLogin() {
        const pass = document.getElementById('login-pass').value.trim();
        const res = await fetch(`${DB_URL}/students/${vkUser.id}.json`);
        const data = await res.json();
        if (data && data.secretCode === pass) {
            myProfile = data;
            openCabinet(data, false, false);
        } else document.getElementById('login-error').style.display = 'block';
    }

    async function doRegister() {
        const profile = {
            id: vkUser.id, 
            name: document.getElementById('reg-name').value.trim(), 
            vkLink: document.getElementById('reg-link').value.trim(), 
            role: document.getElementById('reg-role').value, 
            secretCode: document.getElementById('reg-pass').value.trim(), 
            xp: 0, mana: 0, photo: "",
            skills: [], spells: [], potions: [], diary: "", homework: ""
        };
        if(!profile.name || !profile.secretCode) return alert("Заполните поля!");
        await fetch(`${DB_URL}/students/${vkUser.id}.json`, { method: 'PUT', body: JSON.stringify(profile) });
        myProfile = profile;
        openCabinet(profile, false, false);
    }

    async function doDirectorLogin() {
        if (vkUser.id !== DIRECTOR_ID) return alert("Вы не Директор!");
        if (document.getElementById('dir-pass').value.trim() !== DIRECTOR_SECRET) return alert("Неверное кодовое слово!");
        
        const profile = {
            id: vkUser.id, name: "Теодор Нотт", vkLink: "https://vk.ru/nott_cr", 
            role: 'director', secretCode: "admin", xp: 9999, mana: 9999, photo: "",
            skills: [{title: "Травология", desc: "Профессор Травологии"}], 
            spells: [], potions: [], diary: "", homework: ""
        };
        await fetch(`${DB_URL}/students/${vkUser.id}.json`, { method: 'PUT', body: JSON.stringify(profile) });
        myProfile = profile;
        openCabinet(profile, false, false);
    }

    function openCabinet(profile, adminMode, guestMode) {
        hideAll();
        viewProfile = profile;
        isAdminView = adminMode;
        isGuestView = guestMode;

        document.getElementById('cabinet').classList.remove('hidden');

        document.getElementById('cabinet-title').textContent = profile.name;
        document.getElementById('cabinet-role').textContent = profile.role === 'director' ? '👑 Директор' : (profile.role === 'professor' ? '📖 Профессор' : '🎓 Студент');
        document.getElementById('saved-link').textContent = profile.vkLink || '—';
        
        let showPass = false;
        // Пароль видят только: Директор (в админке) и сам пользователь (в своем кабинете). Гости - нет.
        if (adminMode) showPass = true;
        else if (!guestMode && profile.id === vkUser.id) showPass = true;

        document.getElementById('saved-pass').textContent = showPass ? (profile.secretCode || 'admin') : '******'; 
        document.getElementById('xp').textContent = profile.xp || 0;
        document.getElementById('mana').textContent = profile.mana || 0;
        
        if (profile.photo) {
            document.getElementById('portrait-empty').classList.add('hidden');
            document.getElementById('avatar-img').src = profile.photo;
            document.getElementById('avatar-img').classList.remove('hidden');
        } else {
            document.getElementById('portrait-empty').classList.remove('hidden');
            document.getElementById('avatar-img').classList.add('hidden');
        }

        // Кнопки в шапке
        let btnHtml = '';
        if (adminMode) {
            document.getElementById('header-title').textContent = "РЕЖИМ ДИРЕКТОРА / " + profile.name;
            btnHtml = `
                <button class="text-button" onclick="openEdit()" style="color:var(--primary);">✏️ Редактировать</button>
                <button class="text-button" onclick="backToBase()" style="color:#ff5555;">← Назад в базу</button>`;
        } else if (guestMode) {
            document.getElementById('header-title').textContent = "ПРОСМОТР ГОСТЯ / " + profile.name;
            btnHtml = `<button class="text-button" onclick="backToStudents()" style="color:var(--primary);">← Назад к профилям</button>`;
        } else {
            document.getElementById('header-title').textContent = "Хогвартс / Досье";
            btnHtml = `
                <button class="text-button" onclick="openEdit()" style="color:var(--primary);">✏️ Редактировать</button>
                <button class="text-button" style="color:#ff5555;" onclick="location.reload()">Выйти</button>`;
        }
        document.getElementById('header-buttons').innerHTML = btnHtml;

        // Показ кнопки "Написать" (если смотрим чужой профиль)
        if (guestMode && profile.id !== vkUser.id) {
            document.getElementById('visit-actions').classList.remove('hidden');
        } else {
            document.getElementById('visit-actions').classList.add('hidden');
        }

        switchTab('skills');
    }

    function openEdit() {
        document.getElementById('edit-name').value = viewProfile.name || '';
        document.getElementById('edit-link').value = viewProfile.vkLink || '';
        document.getElementById('edit-pass').value = viewProfile.secretCode || '';
        document.getElementById('edit-photo').value = viewProfile.photo || '';
        hideAll(); 
        document.getElementById('edit-screen').classList.remove('hidden');
    }

    async function saveEdit() {
        viewProfile.name = document.getElementById('edit-name').value;
        viewProfile.vkLink = document.getElementById('edit-link').value;
        viewProfile.secretCode = document.getElementById('edit-pass').value;
        viewProfile.photo = document.getElementById('edit-photo').value;

        await fetch(`${DB_URL}/students/${viewProfile.id}.json`, { method: 'PATCH', body: JSON.stringify(viewProfile) });
        if(!isAdminView && viewProfile.id === vkUser.id) myProfile = viewProfile;
        
        openCabinet(viewProfile, isAdminView, isGuestView);
    }

    function cancelEdit() { openCabinet(viewProfile, isAdminView, isGuestView); }

    function switchTab(tab) {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`.tabs button[data-tab="${tab}"]`);
        if (btn) btn.classList.add('active');
        
        const root = document.getElementById('book-content');
        if (tab === 'skills') renderList('skills', 'Навыки', '✦', root);
        else if (tab === 'spells') renderList('spells', 'Заклинания', '⚡', root);
        else if (tab === 'potions') renderList('potions', 'Зелья', '🧪', root);
        else if (tab === 'diary') {
            root.innerHTML = `<div class="skill-card"><h3>📖 Личный дневник</h3><p>${viewProfile.diary || 'Дневник пуст.'}</p></div>`;
            if (!isGuestView && (isAdminView || viewProfile.id === vkUser.id)) {
                root.innerHTML += `<div class="builder-box"><textarea id="edit-diary" rows="5">${viewProfile.diary||''}</textarea><button onclick="saveText('diary')" style="margin-top:10px; background:#4CAF50; color:white;">Сохранить</button></div>`;
            }
        }
        else if (tab === 'homework') {
            root.innerHTML = `<div class="skill-card"><h3>📝 Домашнее задание</h3><p>${viewProfile.homework || 'Работа не сдана.'}</p></div>`;
            if (!isGuestView && !isAdminView && viewProfile.id === vkUser.id) {
                root.innerHTML += `<div class="builder-box"><textarea id="edit-hw" rows="5">${viewProfile.homework||''}</textarea><button onclick="saveText('homework')" style="margin-top:10px; background:#4CAF50; color:white;">Сдать ДЗ</button></div>`;
            }
        }
        else if (tab === 'students') renderStudentsList(root);
        else if (tab === 'messages') renderMessagesList(root);
    }

    function renderList(type, title, icon, container) {
        let html = `<div class="skills-grid">`;
        const items = viewProfile[type] || [];
        if (items.length > 0) {
            items.forEach((item, index) => {
                html += `
                <div class="skill-card">
                    <h3>${icon} ${item.title}</h3>
                    <p>${item.desc}</p>
                    ${isAdminView ? `<button onclick="deleteItem('${type}', ${index})" style="border:1px solid #ff5555; color:#ff5555; padding:10px; background:transparent; border-radius:4px;">Удалить</button>` : ''}
                </div>`;
            });
        } else html += `<p style="color:var(--accent)">Пусто.</p>`;
        html += `</div>`;

        if (isAdminView) {
            html += `
            <div class="builder-box">
                <h3>Добавить ${title}</h3>
                <label>Название:</label><input type="text" id="add-title">
                <label>Описание:</label><textarea id="add-desc" rows="2"></textarea>
                <button onclick="addItem('${type}')" style="background: #4CAF50; color: white; margin-top: 10px;">Добавить</button>
            </div>`;
        }
        container.innerHTML = html;
    }

    async function addItem(type) {
        const title = document.getElementById('add-title').value.trim();
        const desc = document.getElementById('add-desc').value.trim();
        if (!title) return alert("Введите название!");
        if (!viewProfile[type]) viewProfile[type] = [];
        viewProfile[type].push({ title: title, desc: desc });
        await fetch(`${DB_URL}/students/${viewProfile.id}.json`, { method: 'PATCH', body: JSON.stringify({ [type]: viewProfile[type] }) });
        switchTab(type);
    }

    async function deleteItem(type, index) {
        if (!confirm("Удалить?")) return;
        viewProfile[type].splice(index, 1);
        await fetch(`${DB_URL}/students/${viewProfile.id}.json`, { method: 'PATCH', body: JSON.stringify({ [type]: viewProfile[type] }) });
        switchTab(type);
    }

    async function saveText(field) {
        const val = document.getElementById(`edit-${field}`).value;
        viewProfile[field] = val;
        await fetch(`${DB_URL}/students/${viewProfile.id}.json`, { method: 'PATCH', body: JSON.stringify({ [field]: val }) });
        alert("Сохранено!");
        switchTab(field);
    }

    // СПИСОК ВСЕХ ПРОФИЛЕЙ (ДЛЯ ВСЕХ)
    async function renderStudentsList(container) {
        container.innerHTML = `<div class="center-menu">Загрузка...</div>`;
        const res = await fetch(`${DB_URL}/students.json`);
        const allStudents = await res.json() || {};
        
        let html = `<h2>База профилей</h2><div class="admin-panel">`;
        Object.values(allStudents).forEach(student => {
            if(student.id !== vkUser.id) { // не показываем себя
                html += `
                <div class="admin-card">
                    <div style="display:flex; gap:10px; align-items:center;">
                        ${student.photo ? `<img src="${student.photo}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">` : `<div style="width:40px; height:40px; border-radius:50%; background:var(--dark-accent); display:grid; place-items:center;">✦</div>`}
                        <div>
                            <h3 style="margin:0; font-size:18px;">${student.name}</h3>
                            <span style="font-size:12px; color:var(--accent);">${student.role}</span>
                        </div>
                    </div>
                    <!-- Кнопка для просмотра профиля -->
                    <button onclick="visitProfile('${student.id}')" style="background:var(--primary); color:var(--bg); margin-top:10px;">
                        ${myProfile.role === 'director' ? '🚪 Зайти в комнату' : '👁 Посмотреть профиль'}
                    </button>
                </div>`;
            }
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    async function visitProfile(studentId) {
        const res = await fetch(`${DB_URL}/students/${studentId}.json`);
        const data = await res.json();
        
        // Если зашел директор, он редактирует (adminMode = true)
        // Если зашел студент, он просто смотрит (guestMode = true)
        if (myProfile.role === 'director') {
            openCabinet(data, true, false); 
        } else {
            openCabinet(data, false, true); 
        }
    }

    function backToStudents() {
        openCabinet(myProfile, false, false);
        document.querySelector('.tabs button[data-tab="students"]').click();
    }

    // МЕССЕНДЖЕР (СОВЫ)
    async function renderMessagesList(container) {
        container.innerHTML = `<div class="center-menu">Загрузка диалогов...</div>`;
        const res = await fetch(`${DB_URL}/students.json`);
        const allStudents = await res.json() || {};
        
        let html = `<h2>Личные сообщения (Совы)</h2><div class="admin-panel">`;
        Object.values(allStudents).forEach(student => {
            if(student.id !== vkUser.id) {
                html += `
                <div class="admin-card">
                    <h3 style="margin:0; font-size:18px;">${student.name}</h3>
                    <button onclick="openChat('${student.id}', '${student.name}')" style="background:var(--accent); color:white; margin-top:10px;">Открыть переписку</button>
                </div>`;
            }
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    function getChatId(id1, id2) {
        const sorted = [id1, id2].sort((a,b) => a - b);
        return `${sorted[0]}_${sorted[1]}`;
    }

    function startChatFromProfile() {
        openChat(viewProfile.id, viewProfile.name);
    }

    async function openChat(targetId, targetName) {
        currentChatId = getChatId(vkUser.id, targetId);
        const root = document.getElementById('book-content');
        
        root.innerHTML = `
            <h2>Переписка с ${targetName}</h2>
            <div class="chat-container">
                <div class="chat-messages" id="chat-box"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Сообщение или ссылка на файл...">
                    <button onclick="sendMsg('${targetId}')">Отправить</button>
                </div>
            </div>
            <button onclick="switchTab('messages')" style="margin-top:15px;">← Назад к диалогам</button>
        `;

        const chatBox = document.getElementById('chat-box');
        
        if (chatListener) chatListener.off();
        
        chatListener = firebase.database().ref(`messages/${currentChatId}`).on('value', (snapshot) => {
            const msgs = snapshot.val() || {};
            chatBox.innerHTML = '';
            Object.values(msgs).forEach(m => {
                const isMe = m.senderId === vkUser.id;
                let content = m.text;
                if (content.match(/\.(jpeg|jpg|gif|png|webp)$/i) || content.includes('sun9-')) {
                    content = `<img src="${m.text}">`;
                }
                chatBox.innerHTML += `<div class="msg ${isMe ? 'my' : 'their'}"><small>${m.senderName}</small><br>${content}</div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    async function sendMsg(targetId) {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        const msg = {
            senderId: vkUser.id,
            senderName: myProfile.name,
            text: text,
            time: Date.now()
        };

        await fetch(`${DB_URL}/messages/${currentChatId}.json`, {
            method: 'POST',
            body: JSON.stringify(msg)
        });
        input.value = '';
    }
</script>
