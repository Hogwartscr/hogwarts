<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хогвартс ВГП</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        :root { --primary: #BEA7B9; --accent: #975F8F; --dark-accent: #48294E; --panel: #1F1B3D; --bg: #161228; --text: #EADCE6; }
        *{box-sizing:border-box}
        body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px; margin: 0;}
        .container{max-width:1100px;padding:30px 40px;background:linear-gradient(120deg, rgba(31,27,61,0.95), rgba(22,18,40,0.98));border: 1px solid var(--accent);border-radius:8px;margin: 0 auto; box-shadow: 0 24px 100px rgba(0,0,0,0.8); display: none;}
        
        h1,h2,h3{font-weight:normal;color:var(--primary);margin-top:0;}
        button{background:var(--primary);color:var(--bg);border-radius:4px;font-family:inherit;font-weight:bold;transition:all .2s;padding:12px;border:none;cursor:pointer;font-size: 14px;}
        button:hover{background:var(--accent); color:white;}
        input,select,textarea{font-family:inherit;background:rgba(0,0,0,0.2);color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:10px;font-size:14px;width:100%;margin-top:5px}
        select option{background:var(--panel)}
        label{color:var(--primary);font-weight:normal;display:block;margin-top:12px; font-size:14px;}
        
        .cabinet-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--dark-accent);padding-bottom:18px;gap:10px}
        .eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
        .text-button{width:auto;margin:0;padding:8px 0;background:transparent;color:var(--primary);font-size:14px}
        .text-button:hover{color:var(--accent); background:transparent;}
        
        .character{display:grid;grid-template-columns:180px 1fr;gap:34px;margin:32px 0 16px;align-items:center}
        .portrait-wrap{height:230px;position:relative;border:1px solid var(--accent);padding:6px;background:var(--bg);box-shadow:0 0 15px rgba(151,95,143,0.3)}
        #portrait-empty{height:100%;display:grid;place-items:center;font-size:76px;color:var(--accent);background:radial-gradient(ellipse at 50% 40%,#48294E55,#161228)}
        
        .cabinet h1{font-size:42px;line-height:1.15;margin:0;color:var(--primary);}
        .character-details{display:flex;gap:26px;flex-wrap:wrap;margin:24px 0 10px}
        .character-details span{font-size:12px; color: var(--accent);}
        .character-details strong{display:block;font-size:15px;font-weight:normal;color:var(--text);margin-top:7px; word-break: break-all;}
        
        .resources{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;padding:22px 24px;background:rgba(72,41,78,0.3);border:1px solid var(--accent);border-left:4px solid var(--primary);margin:22px 0 38px;border-radius:4px;}
        .resources label{margin:0;display:flex;justify-content:space-between}
        .resources span{font-size:11px;letter-spacing:2px;color:var(--primary)}
        .resources strong{display:block;font-size:36px;color:var(--primary);margin-top:8px}
        
        .book-header { margin-top: 40px; border-top: 1px solid var(--dark-accent); padding-top: 20px; }
        .tabs{display:flex;gap:26px;border-bottom:1px solid var(--dark-accent);margin:24px 0; flex-wrap:wrap;}
        .tabs button{border-radius:0;width:auto;background:none;color:var(--accent);font-size:16px;padding:12px 0;margin:0;border-bottom:2px solid transparent}
        .tabs button.active{color:var(--primary);border-color:var(--primary); font-weight:bold;}
        
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .skill-card { border: 1px solid var(--accent); background: rgba(31,27,61,0.6); padding: 20px; border-radius: 4px; display: flex; flex-direction: column; }
        .skill-card h3 { color: var(--primary); font-size: 22px; margin: 0 0 10px 0; display: flex; align-items: center; gap: 10px; }
        .skill-card p { font-size: 14px; color: var(--text); line-height: 1.5; margin-bottom: 20px; flex-grow: 1; white-space: pre-wrap;}
        .skill-card .status { font-size: 12px; color: var(--accent); margin-bottom: 10px; }
        .skill-card button { margin-top: auto; background: transparent; border: 1px solid var(--dark-accent); color: var(--accent); cursor: not-allowed; }
        
        .admin-panel { display: grid; gap: 15px; margin-top: 20px;}
        .admin-card { padding: 15px; border: 1px solid var(--accent); border-radius: 6px; background: rgba(72,41,78,0.2); }
        
        .builder-box { border: 1px dashed var(--primary); padding: 20px; margin-top: 20px; border-radius: 6px; background: rgba(0,0,0,0.2); }
        
        .center-menu { text-align: center; padding: 50px 20px; }
        .center-menu button { max-width: 400px; margin: 10px auto; display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loading" class="center-menu" style="color: var(--primary); font-size: 18px;">🔮 Загрузка...</div>

<!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
<div id="main-menu" class="center-menu hidden">
    <h1>Хогвартс ВГП</h1>
    <p class="hint" style="color:var(--accent)">Выберите, как вы хотите войти.</p>
    <button onclick="showLogin()">🔑 Войти в профиль</button>
    <button onclick="showRegister()" style="background: transparent; border: 1px solid var(--primary); color: var(--primary);">📝 Зарегистрироваться</button>
    <button onclick="showDirectorLogin()" style="background: #99564b; color: white; margin-top: 30px;">👑 Вход для Директора</button>
</div>

<!-- ЭКРАН 2: ВХОД -->
<div id="login-screen" class="center-menu hidden" style="max-width: 400px; margin: 0 auto;">
    <h1>Вход в профиль</h1>
    <label>Ваш пароль:</label>
    <input type="password" id="login-pass" placeholder="Пароль">
    <button onclick="doLogin()" style="margin-top:20px;">Войти</button>
    <p id="login-error" style="color: #ff5555; font-size: 13px; margin-top: 10px; display: none;">Неверный пароль!</p>
    <a onclick="showMenu()" class="text-button" style="display:block; margin-top:20px;">← Назад</a>
</div>

<!-- ЭКРАН 3: РЕГИСТРАЦИЯ -->
<div id="register-screen" class="center-menu hidden" style="max-width: 400px; margin: 0 auto;">
    <h1>Регистрация</h1>
    <label>Ваша роль:</label>
    <select id="reg-role">
        <option value="student">Студент</option>
        <option value="professor">Профессор</option>
    </select>
    <label>Имя персонажа:</label>
    <input type="text" id="reg-name" placeholder="Имя Фамилия">
    <label>Ссылка на ВК:</label>
    <input type="text" id="reg-link" placeholder="https://vk.com/...">
    <label>Придумайте пароль:</label>
    <input type="password" id="reg-pass" placeholder="Пароль">
    <button onclick="doRegister()" style="margin-top: 20px;">Создать профиль</button>
    <a onclick="showMenu()" class="text-button" style="display:block; margin-top:20px;">← Назад</a>
</div>

<!-- ЭКРАН 4: ВХОД ДИРЕКТОРА -->
<div id="director-screen" class="center-menu hidden" style="max-width: 400px; margin: 0 auto;">
    <h1>Вход для Директора</h1>
    <label>Кодовое слово:</label>
    <input type="password" id="dir-pass" placeholder="Кодовое слово">
    <button onclick="doDirectorLogin()" style="margin-top:20px;">Войти</button>
    <a onclick="showMenu()" class="text-button" style="display:block; margin-top:20px;">← Назад</a>
</div>

<!-- ЭКРАН 5: ЛИЧНЫЙ КАБИНЕТ -->
<div id="cabinet" class="container cabinet hidden">
    <header class="cabinet-top">
        <span class="eyebrow" id="header-title">Хогвартс / Досье</span>
        <div id="header-buttons">
            <button class="text-button" style="color:#ff5555;" onclick="location.reload()">Выйти</button>
        </div>
    </header>
    
    <div class="character">
        <div class="portrait-wrap"><div id="portrait-empty">✦</div></div>
        <div class="character-info">
            <p id="room-name" class="eyebrow"></p>
            <h1 id="cabinet-title"></h1>
            <p id="cabinet-role" class="character-subtitle"></p>
            <div class="character-details">
                <span>Ссылка ВК <strong id="saved-link"></strong></span>
                <span>Пароль <strong id="saved-pass"></strong></span>
            </div>
        </div>
    </div>
    
    <div class="resources">
        <div><label><span>Опыт · XP</span></label><strong id="xp">0</strong></div>
        <div><label><span>Мана · MP</span></label><strong id="mana">0</strong></div>
    </div>

    <div class="book-header">
        <span class="eyebrow">Знания, Сила и Инвентарь</span>
        <h2>Книга персонажа</h2>
    </div>

    <nav class="tabs">
        <button data-tab="skills" class="active" onclick="switchTab('skills')">Навыки</button>
        <button data-tab="spells" onclick="switchTab('spells')">Заклинания</button>
        <button data-tab="potions" onclick="switchTab('potions')">Зелья</button>
        <button data-tab="notes" onclick="switchTab('notes')">Заметки</button>
        <button data-tab="director" id="director-tab" class="hidden" onclick="switchTab('director')">👑 База данных</button>
    </nav>
    
    <section id="book-content"></section>
</div>

<script>
    window.onerror = function(msg) {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').innerHTML = `<span style="color:red">Ошибка: ${msg}<br>Попробуйте обновить.</span>`;
        return false;
    };

    const DB_URL = "https://hogwartscr-default-rtdb.europe-west1.firebasedatabase.app";
    const DIRECTOR_ID = 836264843; 
    const DIRECTOR_SECRET = "коньяк"; 
    
    let vkUser = null;
    let myProfile = null;     
    let viewProfile = null;   
    let isAdminView = false;  
    let currentTab = 'skills';

    if (window.vkBridge) {
        vkBridge.send('VKWebAppInit').then(() => vkBridge.send('VKWebAppGetUserInfo')).then(info => {
            vkUser = info;
            document.getElementById('loading').style.display = 'none';
            showMenu();
        }).catch(e => {
            document.getElementById('loading').innerHTML = "Ошибка ВК Bridge";
        });
    } else {
        document.getElementById('loading').innerHTML = "Откройте через ВКонтакте!";
    }

    function hideAll() {
        ['main-menu', 'login-screen', 'register-screen', 'director-screen', 'cabinet'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
    }

    function showMenu() { hideAll(); document.getElementById('main-menu').classList.remove('hidden'); }
    function showLogin() { hideAll(); document.getElementById('login-screen').classList.remove('hidden'); }
    function showRegister() { hideAll(); document.getElementById('register-screen').classList.remove('hidden'); }
    function showDirectorLogin() { hideAll(); document.getElementById('director-screen').classList.remove('hidden'); }

    async function doLogin() {
        const pass = document.getElementById('login-pass').value.trim();
        const res = await fetch(`${DB_URL}/students/${vkUser.id}.json`);
        const data = await res.json();
        
        if (data && data.secretCode === pass) {
            myProfile = data;
            openCabinet(data, false);
        } else {
            document.getElementById('login-error').style.display = 'block';
        }
    }

    async function doRegister() {
        const profile = {
            id: vkUser.id, 
            name: document.getElementById('reg-name').value.trim(), 
            vkLink: document.getElementById('reg-link').value.trim(), 
            role: document.getElementById('reg-role').value, 
            secretCode: document.getElementById('reg-pass').value.trim(), 
            xp: 0, mana: 0, 
            skills: [], spells: [], potions: [], notes: ""
        };
        if(!profile.name || !profile.secretCode) return alert("Заполните поля!");
        
        await fetch(`${DB_URL}/students/${vkUser.id}.json`, { method: 'PUT', body: JSON.stringify(profile) });
        myProfile = profile;
        openCabinet(profile, false);
    }

    async function doDirectorLogin() {
        if (vkUser.id !== DIRECTOR_ID) return alert("Вы не Директор!");
        if (document.getElementById('dir-pass').value.trim() !== DIRECTOR_SECRET) return alert("Неверное кодовое слово!");
        
        const profile = {
            id: vkUser.id, name: "Теодор Нотт", vkLink: "https://vk.ru/nott_cr", 
            role: 'director', secretCode: "admin", xp: 9999, mana: 9999, 
            skills: [{title: "Травология", desc: "Профессор Травологии", status: "Изучено"}], 
            spells: [], potions: [], notes: ""
        };
        await fetch(`${DB_URL}/students/${vkUser.id}.json`, { method: 'PUT', body: JSON.stringify(profile) });
        myProfile = profile;
        openCabinet(profile, false);
    }

    function openCabinet(profile, adminMode) {
        hideAll();
        viewProfile = profile;
        isAdminView = adminMode;
        
        document.getElementById('cabinet').classList.remove('hidden');
        document.getElementById('cabinet').style.display = 'block';

        document.getElementById('cabinet-title').textContent = profile.name;
        document.getElementById('cabinet-role').textContent = profile.role === 'director' ? '👑 Директор' : (profile.role === 'professor' ? '📖 Профессор' : '🎓 Студент');
        document.getElementById('saved-link').textContent = profile.vkLink || '—';
        document.getElementById('saved-pass').textContent = adminMode || profile.role === 'director' ? (profile.secretCode || 'admin') : '******'; 
        document.getElementById('xp').textContent = profile.xp || 0;
        document.getElementById('mana').textContent = profile.mana || 0;
        document.getElementById('room-name').textContent = 'Гостиная · ' + (profile.faculty || 'Хогвартс');

        if (adminMode) {
            document.getElementById('header-title').textContent = "РЕЖИМ ДИРЕКТОРА / " + profile.name;
            document.getElementById('header-buttons').innerHTML = `<button class="text-button" onclick="backToBase()">← Назад в базу</button>`;
        } else {
            document.getElementById('header-title').textContent = "Хогвартс / Досье";
            document.getElementById('header-buttons').innerHTML = `<button class="text-button" style="color:#ff5555;" onclick="location.reload()">Выйти</button>`;
        }

        if (profile.role === 'director' && !adminMode) {
            document.getElementById('director-tab').classList.remove('hidden');
        } else {
            document.getElementById('director-tab').classList.add('hidden');
        }

        switchTab('skills');
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.querySelector(`.tabs button[data-tab="${tab}"]`).classList.add('active');
        
        const root = document.getElementById('book-content');
        
        if (tab === 'skills') renderList('skills', 'Навыки', '✦', root);
        else if (tab === 'spells') renderList('spells', 'Заклинания', '⚡', root);
        else if (tab === 'potions') renderList('potions', 'Зелья', '🧪', root);
        else if (tab === 'notes') {
            root.innerHTML = `<div class="skill-card"><p>${viewProfile.notes || 'Заметок пока нет.'}</p></div>`;
            if (isAdminView) {
                root.innerHTML += `
                <div class="builder-box">
                    <label>Редактировать заметки:</label>
                    <textarea id="edit-notes" rows="5">${viewProfile.notes||''}</textarea>
                    <button onclick="saveNotes()" style="margin-top:10px;">Сохранить заметки</button>
                </div>`;
            }
        }
        else if (tab === 'director') renderDirectorBase(root);
    }

    function renderList(type, title, icon, container) {
        let html = `<div class="skills-grid">`;
        const items = viewProfile[type] || [];
        
        if (items.length > 0) {
            items.forEach((item, index) => {
                html += `
                <div class="skill-card">
                    <h3>${icon} ${item.title}</h3>
                    <p>${item.desc}</p>
                    <div class="status">${item.status || 'Изучено'}</div>
                    ${isAdminView ? `<button onclick="deleteItem('${type}', ${index})" style="border-color:#ff5555; color:#ff5555; cursor:pointer;">Удалить</button>` : `<button disabled>Изучено</button>`}
                </div>`;
            });
        } else {
            html += `<p style="color:var(--accent)">Здесь пока пусто.</p>`;
        }
        html += `</div>`;

        if (isAdminView) {
            html += `
            <div class="builder-box">
                <h3 style="color:var(--primary);">Добавить ${title}</h3>
                <label>Название:</label>
                <input type="text" id="add-title" placeholder="Например: Основы чар">
                <label>Описание:</label>
                <textarea id="add-desc" rows="3" placeholder="Что это дает..."></textarea>
                <button onclick="addItem('${type}')" style="background: #4CAF50; color: white; margin-top: 10px;">Добавить в профиль</button>
            </div>`;
        }
        container.innerHTML = html;
    }

    async function addItem(type) {
        const title = document.getElementById('add-title').value.trim();
        const desc = document.getElementById('add-desc').value.trim();
        if (!title) return alert("Введите название!");

        if (!viewProfile[type]) viewProfile[type] = [];
        viewProfile[type].push({ title: title, desc: desc, status: 'Изучено' });

        await fetch(`${DB_URL}/students/${viewProfile.id}.json`, { method: 'PATCH', body: JSON.stringify({ [type]: viewProfile[type] }) });
        switchTab(type);
    }

    async function deleteItem(type, index) {
        if (!confirm("Удалить эту запись?")) return;
        viewProfile[type].splice(index, 1);
        await fetch(`${DB_URL}/students/${viewProfile.id}.json`, { method: 'PATCH', body: JSON.stringify({ [type]: viewProfile[type] }) });
        switchTab(type);
    }

    async function saveNotes() {
        const text = document.getElementById('edit-notes').value;
        viewProfile.notes = text;
        await fetch(`${DB_URL}/students/${viewProfile.id}.json`, { method: 'PATCH', body: JSON.stringify({ notes: text }) });
        alert("Заметки обновлены!");
    }

    async function renderDirectorBase(container) {
        container.innerHTML = `<div class="center-menu">Загрузка базы...</div>`;
        const res = await fetch(`${DB_URL}/students.json`);
        const allStudents = await res.json() || {};
        
        let html = `<h2>Все учетные записи</h2><div class="admin-panel">`;
        Object.values(allStudents).forEach(student => {
            html += `
            <div class="admin-card">
                <h3>${student.name} <span style="font-size:12px; color:var(--primary);">(${student.role})</span></h3>
                <p style="font-size:13px; margin:5px 0;">ВК: <a href="${student.vkLink}" target="_blank" style="color:var(--accent);">${student.vkLink}</a></p>
                <span style="font-size:12px;">XP: ${student.xp || 0} | MP: ${student.mana || 0}</span>
                <div style="margin-top: 15px;">
                    <button onclick="adminOpenRoom('${student.id}')" style="background:var(--primary); color:var(--bg);">🚪 Зайти в комнату</button>
                </div>
            </div>`;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    async function adminOpenRoom(studentId) {
        const res = await fetch(`${DB_URL}/students/${studentId}.json`);
        const data = await res.json();
        openCabinet(data, true);
    }

    function backToBase() {
        openCabinet(myProfile, false);
        document.querySelector('.tabs button[data-tab="director"]').click();
    }
</script>
</body>
</html>
