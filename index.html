<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хогвартс ВГП</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        body { background-color: #161228; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { background: #1F1B3D; padding: 20px; border-radius: 8px; display: inline-block; border: 1px solid #975F8F; }
        button { background: #BEA7B9; color: #111; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Тестовая страница</h1>
        <p>Если вы видите этот текст, значит ВК загрузил новый файл!</p>
        <p id="vk-status" style="color: orange;">Проверка ВК...</p>
        <button onclick="testButton()">Нажми меня</button>
    </div>

    <script>
        const statusEl = document.getElementById('vk-status');

        if (window.vkBridge) {
            vkBridge.send('VKWebAppInit').then(() => {
                statusEl.innerText = "✅ ВК Bridge работает!";
                statusEl.style.color = "lightgreen";
                return vkBridge.send('VKWebAppGetUserInfo');
            }).then(user => {
                statusEl.innerText += " | Ваш ID: " + user.id;
            }).catch(e => {
                statusEl.innerText = "❌ Ошибка ВК: " + e.message;
                statusEl.style.color = "red";
            });
        } else {
            statusEl.innerText = "❌ VK Bridge не загрузился. (Возможно, вы открыли не в ВК)";
            statusEl.style.color = "red";
        }

        function testButton() {
            alert("Кнопки работают! Код загружен.");
        }
    </script>
</body>
</html>
